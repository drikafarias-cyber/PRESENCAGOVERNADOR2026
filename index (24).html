<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>GOVERNADORGUARULHOS2026 — Lista de Presença</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --navy-950:#0c1526;
    --navy-900:#101d33;
    --navy-800:#172a45;
    --navy-700:#233a5c;
    --gold-500:#d3a44e;
    --gold-400:#e2ba6f;
    --cream-100:#f3efe4;
    --muted-400:#8ea0bd;
    --green-500:#3fa892;
    --red-500:#d9564f;
    --radius-card:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background: radial-gradient(ellipse at top, #16294a 0%, var(--navy-950) 62%);
    color:var(--cream-100);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:28px 16px 40px;
  }
  .wrap{width:100%;max-width:440px;}
  .badge-top{
    display:flex; align-items:center; justify-content:center; gap:10px;
    margin-bottom:22px; color:var(--gold-400);
  }
  .badge-top svg{width:22px;height:22px;flex-shrink:0;}
  .badge-top span{font-size:13px;font-weight:600;color:var(--muted-400);}
  .card{
    background:linear-gradient(180deg, var(--navy-800), var(--navy-900));
    border:1px solid rgba(211,164,78,.18);
    border-radius:var(--radius-card);
    padding:32px 26px 28px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.55);
    position:relative; overflow:hidden;
  }
  .card::before{
    content:""; position:absolute; top:0; left:0; right:0; height:4px;
    background:linear-gradient(90deg, var(--gold-500), var(--gold-400), var(--gold-500));
  }
  h1{font-family:'Archivo',sans-serif; font-weight:800; font-size:26px; line-height:1.15; margin:0 0 6px;}
  .event-name{font-family:'Archivo',sans-serif; font-weight:700; font-size:14px; color:var(--gold-400); margin:0 0 18px;}
  p.lead{font-size:14.5px; color:var(--muted-400); line-height:1.5; margin:0 0 22px;}
  .status-row{
    display:flex; align-items:center; gap:10px;
    background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.06);
    border-radius:12px; padding:12px 14px; margin-bottom:20px; font-size:13.5px;
  }
  .status-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--muted-400);}
  .status-dot.ok{background:var(--green-500);box-shadow:0 0 0 4px rgba(63,168,146,.18);}
  .status-dot.bad{background:var(--red-500);box-shadow:0 0 0 4px rgba(217,86,79,.18);}
  .status-dot.pending{background:var(--gold-500);box-shadow:0 0 0 4px rgba(211,164,78,.18);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .btn{
    width:100%; border:none; border-radius:12px; padding:15px 18px;
    font-weight:700; font-size:15.5px; cursor:pointer;
    transition:transform .12s ease, filter .12s ease;
  }
  .btn:active{transform:scale(.985);}
  .btn-primary{background:linear-gradient(180deg, var(--gold-400), var(--gold-500)); color:#20160a;}
  .btn-primary:hover{filter:brightness(1.05);}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;filter:none;}
  label{display:block; font-size:12.5px; font-weight:600; color:var(--muted-400); margin:0 0 6px;}
  .field{margin-bottom:16px;}
  input[type=text], input[type=tel]{
    width:100%; background:var(--navy-700); border:1px solid rgba(255,255,255,.08);
    border-radius:10px; padding:13px 14px; color:var(--cream-100); font-size:15.5px; outline:none;
  }
  input::placeholder{color:#5f7091;}
  input:focus{border-color:var(--gold-500);}
  .hint{font-size:12px; color:var(--muted-400); margin-top:6px;}
  .error-text{font-size:13px; color:var(--red-500); margin-top:10px; display:none;}
  .center-icon{
    width:64px;height:64px;border-radius:50%;
    display:flex;align-items:center;justify-content:center; margin:4px auto 18px;
  }
  .center-icon.ok{background:rgba(63,168,146,.15);}
  .center-icon.bad{background:rgba(217,86,79,.15);}
  .center-icon svg{width:30px;height:30px;}
  .success-screen, .blocked-screen{text-align:center;}
  .success-screen h1, .blocked-screen h1{font-size:22px;}
  .counter-pill{
    display:inline-block; margin-top:16px; background:rgba(211,164,78,.12);
    border:1px solid rgba(211,164,78,.3); color:var(--gold-400);
    font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:999px;
  }
  .footer-link{text-align:center; margin-top:18px; font-size:12px; color:#4c5f80;}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ======================= CONFIGURAÇÃO ======================= */
const EVENT_NAME = "GOVERNADORGUARULHOS2026";
const EVENT_LAT = -23.4945227;
const EVENT_LNG = -46.5507023;
const EVENT_RADIUS_M = 150;   // ajuste aqui depois de calibrar no local
const MAX_PER_PHONE = 5;
const MAX_PER_DEVICE = 5;
const SHEET_ENDPOINT = "https://script.google.com/macros/s/AKfycbxHnlP1WKmODCbQDqHPujoFW9MAEbnLRGoLUAtVoWvj14SRK3LYrPg0aX35-1ilOx5I/exec";

/* ======================= HELPERS ======================= */
function haversine(lat1, lng1, lat2, lng2){
  const R = 6371000;
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2-lat1), dLng = toRad(lng2-lng1);
  const a = Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}
function normPhone(p){ return p.replace(/\D/g,''); }
function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }
async function withRetry(fn, attempts=3){
  let lastErr;
  for(let i=0;i<attempts;i++){
    try{ return await fn(); }
    catch(e){ lastErr = e; await sleep(400 * Math.pow(2,i)); }
  }
  throw lastErr;
}
function getDeviceCount(){
  return parseInt(localStorage.getItem('my-count') || '0', 10);
}
function setDeviceCount(n){
  localStorage.setItem('my-count', String(n));
}
async function getPhoneCount(phone){
  const res = await withRetry(() =>
    fetch(SHEET_ENDPOINT + '?checkPhone=' + encodeURIComponent(phone)).then(r => r.json())
  );
  return res.count || 0;
}
async function submitRegistration(record){
  await withRetry(() =>
    fetch(SHEET_ENDPOINT, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(record)
    })
  );
}

/* ======================= ICONS ======================= */
const ICON_PIN = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.4"/></svg>`;
const ICON_CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="#3fa892" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg>`;
const ICON_X = `<svg viewBox="0 0 24 24" fill="none" stroke="#d9564f" stroke-width="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>`;

const app = document.getElementById('app');
function badgeTop(){
  return `<div class="badge-top">${ICON_PIN}<span>Credenciamento do evento</span></div>`;
}

/* ======================= FLOW ======================= */
renderCheckStep();

function renderCheckStep(){
  app.innerHTML = `
    ${badgeTop()}
    <div class="card">
      <h1>Confirmar presença</h1>
      <p class="event-name">${EVENT_NAME}</p>
      <p class="lead">Para se cadastrar, você precisa estar dentro da área do evento. Toque no botão abaixo e permita o acesso à localização quando o navegador pedir.</p>
      <div class="status-row" id="statusRow">
        <div class="status-dot" id="statusDot"></div>
        <div id="statusText">Aguardando verificação de localização</div>
      </div>
      <button class="btn btn-primary" id="checkBtn">Verificar minha localização</button>
      <p class="error-text" id="errText"></p>
    </div>
    <div class="footer-link">Problemas para acessar? Fale com a organização do evento.</div>
  `;
  document.getElementById('checkBtn').onclick = runLocationCheck;
}

function runLocationCheck(){
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  const err = document.getElementById('errText');
  const btn = document.getElementById('checkBtn');
  err.style.display = 'none';
  dot.className = 'status-dot pending';
  txt.textContent = 'Obtendo sua localização...';
  btn.disabled = true;

  if(!navigator.geolocation){
    dot.className = 'status-dot bad';
    txt.textContent = 'Este navegador não suporta localização.';
    btn.disabled = false;
    return;
  }

  navigator.geolocation.getCurrentPosition((pos) => {
    const dist = haversine(pos.coords.latitude, pos.coords.longitude, EVENT_LAT, EVENT_LNG);
    if(dist <= EVENT_RADIUS_M){
      dot.className = 'status-dot ok';
      txt.textContent = 'Localização confirmada — você está na área do evento.';
      setTimeout(renderForm, 500);
    } else {
      dot.className = 'status-dot bad';
      txt.textContent = 'Você está fora da área do evento (~' + Math.round(dist) + 'm do local).';
      btn.disabled = false;
      err.style.display = 'block';
      err.textContent = 'Aproxime-se do local do evento e tente novamente.';
    }
  }, (geoErr) => {
    dot.className = 'status-dot bad';
    txt.textContent = 'Não foi possível obter sua localização.';
    btn.disabled = false;
    err.style.display = 'block';
    err.textContent = geoErr.code === 1
      ? 'Você negou o acesso à localização. Ative a permissão de localização para este site nas configurações do navegador e tente novamente.'
      : 'Verifique se o GPS do celular está ativado e tente novamente.';
  }, { enableHighAccuracy: true, timeout: 12000, maximumAge: 0 });
}

function renderForm(){
  const deviceCount = getDeviceCount();
  if(deviceCount >= MAX_PER_DEVICE){
    renderBlocked('Este aparelho já atingiu o limite de ' + MAX_PER_DEVICE + ' cadastros.');
    return;
  }
  app.innerHTML = `
    ${badgeTop()}
    <div class="card">
      <h1>Lista de presença</h1>
      <p class="event-name">${EVENT_NAME}</p>
      <div class="field">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="Digite seu nome" autocomplete="name">
      </div>
      <div class="field">
        <label for="telefone">Telefone (com DDD)</label>
        <input type="tel" id="telefone" placeholder="(11) 91234-5678" autocomplete="tel">
      </div>
      <div class="field">
        <label for="convidado">Convidado por</label>
        <input type="text" id="convidado" placeholder="Nome de quem convidou">
      </div>
      <button class="btn btn-primary" id="submitBtn">Confirmar presença</button>
      <p class="error-text" id="formErr"></p>
      <p class="hint">Cadastros neste aparelho: ${deviceCount} de ${MAX_PER_DEVICE}</p>
    </div>
  `;
  document.getElementById('submitBtn').onclick = submitForm;
}

async function submitForm(){
  const nome = document.getElementById('nome').value.trim();
  const telRaw = document.getElementById('telefone').value.trim();
  const convidado = document.getElementById('convidado').value.trim();
  const err = document.getElementById('formErr');
  const btn = document.getElementById('submitBtn');
  err.style.display = 'none';

  if(!nome || !telRaw || !convidado){
    err.textContent = 'Preencha nome, telefone e quem convidou.';
    err.style.display = 'block';
    return;
  }
  const phone = normPhone(telRaw);
  if(phone.length < 10){
    err.textContent = 'Digite um telefone válido com DDD.';
    err.style.display = 'block';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Enviando...';

  try{
    const deviceCount = getDeviceCount();
    if(deviceCount >= MAX_PER_DEVICE){
      renderBlocked('Este aparelho já atingiu o limite de ' + MAX_PER_DEVICE + ' cadastros.');
      return;
    }
    const phoneCount = await getPhoneCount(phone);
    if(phoneCount >= MAX_PER_PHONE){
      renderBlocked('Este telefone já atingiu o limite de ' + MAX_PER_PHONE + ' cadastros.');
      return;
    }

    await submitRegistration({ nome, telefone: telRaw, convidadoPor: convidado });
    const newDeviceCount = deviceCount + 1;
    setDeviceCount(newDeviceCount);

    renderSuccess(nome, newDeviceCount);
  }catch(e){
    err.textContent = 'A rede está congestionada. Toque em "Confirmar presença" novamente.';
    err.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Confirmar presença';
  }
}

function renderSuccess(nome, deviceCount){
  app.innerHTML = `
    ${badgeTop()}
    <div class="card success-screen">
      <div class="center-icon ok">${ICON_CHECK}</div>
      <h1>Presença confirmada</h1>
      <p class="lead">${nome}, seu cadastro foi registrado com sucesso.</p>
      <div class="counter-pill">${deviceCount} de ${MAX_PER_DEVICE} cadastros neste aparelho</div>
    </div>
  `;
}

function renderBlocked(message){
  app.innerHTML = `
    ${badgeTop()}
    <div class="card blocked-screen">
      <div class="center-icon bad">${ICON_X}</div>
      <h1>Não foi possível cadastrar</h1>
      <p class="lead">${message}</p>
    </div>
    <div class="footer-link">Precisa de ajuda? Fale com a organização do evento.</div>
  `;
}
</script>
</body>
</html>
